
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fce4ec">
  <title>Pedido de namoro</title>

  <style>
    :root {
      --rosa-bebe: #fce4ec;
      --rosa-suave: #fff5f7;
      --bordo: #800f2f;
      --bordo-escuro: #590d22;
      --rosa: #c9184a;
      --branco: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(16px, 4vw, 32px);
      background:
        radial-gradient(ellipse at top, #fffafd 0, transparent 55%),
        var(--rosa-bebe);
      color: var(--bordo-escuro);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 680px;
      padding: clamp(28px, 6vw, 56px);
      text-align: center;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(128, 15, 47, 0.08);
      border-radius: 24px;
      box-shadow: 0 18px 55px rgba(89, 13, 34, 0.08);
    }

    h1 {
      margin: 0 0 clamp(24px, 5vw, 38px);
      color: var(--bordo);
      font-size: clamp(34px, 7vw, 46px);
      font-weight: 650;
      letter-spacing: -0.6px;
      line-height: 1.2;
    }

    .introducao {
      margin: 0 0 18px;
      font-size: clamp(21px, 4.2vw, 28px);
      font-weight: 500;
      line-height: 1.5;
    }

    .pergunta {
      margin: 0;
      color: var(--bordo);
      font-size: clamp(32px, 7vw, 50px);
      font-weight: 750;
      line-height: 1.25;
    }

    .linha {
      width: 65px;
      height: 3px;
      margin: 24px auto 0;
      background: var(--rosa);
      border-radius: 10px;
    }

    .botoes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-top: clamp(32px, 6vw, 48px);
    }

    button {
      min-width: 140px;
      min-height: 54px;
      max-width: calc(100vw - 32px);
      padding: 13px 22px;
      border-radius: 50px;
      font-family: inherit;
      font-size: 20px;
      font-weight: 650;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 11px;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    #sim {
      color: var(--branco);
      background: var(--bordo);
      border: 2px solid var(--bordo);
      transition: background 0.2s, transform 0.2s;
    }

    #sim:hover {
      background: var(--rosa);
      border-color: var(--rosa);
      transform: translateY(-2px);
    }

    #nao {
      color: var(--bordo);
      background: var(--rosa-suave);
      border: 2px solid var(--bordo);
      z-index: 100;
    }

    #nao.fugir {
      position: fixed;
      margin: 0;
      transition: left 0.18s ease, top 0.18s ease;
    }

    .icone {
      width: 23px;
      height: 23px;
      flex-shrink: 0;
    }

    .rodape {
      margin: 36px 0 0;
      color: #965367;
      font-size: 17px;
      letter-spacing: 0.3px;
      line-height: 1.5;
    }

    #resultado {
      display: none;
    }

    #resultado h2 {
      color: var(--bordo);
      font-size: clamp(34px, 7vw, 48px);
      line-height: 1.3;
      margin: 0 0 25px;
    }

    #resultado p {
      font-size: clamp(20px, 4vw, 25px);
      line-height: 1.65;
      margin: 0 auto;
      max-width: 550px;
    }

    .whatsapp-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      max-width: 100%;
      min-height: 54px;
      margin-top: 28px;
      padding: 13px 22px;
      border: 0;
      border-radius: 50px;
      background: #168a57;
      color: var(--branco);
      font-size: 19px;
      font-weight: 650;
      line-height: 1.35;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }

    .whatsapp-link:hover {
      background: #116f46;
      transform: translateY(-2px);
    }

    .whatsapp-link:focus-visible {
      outline: 3px solid var(--bordo);
      outline-offset: 4px;
    }

    .whatsapp-icone {
      width: 24px;
      height: 24px;
      flex: 0 0 auto;
    }

    .coracao-final {
      width: 55px;
      height: 55px;
      margin: 32px auto 0;
      color: var(--rosa);
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      main {
        padding: 30px 20px;
        border-radius: 20px;
      }

      .botoes {
        gap: 12px;
      }

      button {
        min-width: min(132px, calc((100vw - 64px) / 2));
        padding: 12px 16px;
      }

      .rodape {
        margin-top: 30px;
      }
    }

    @media (max-height: 520px) {
      body {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <main id="pedido">
    <h1>Pedido de namoro</h1>

    <p class="introducao">Tenho uma pergunta pra ti...</p>

    <p class="pergunta">Queres namorar comigo?</p>

    <div class="linha"></div>

    <div class="botoes">
      <button id="sim" type="button">
        Sim
        <svg class="icone" viewBox="0 0 24 24"
             fill="none" stroke="currentColor"
             stroke-width="2" aria-hidden="true">
          <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/>
        </svg>
      </button>

      <button id="nao" type="button">
        Não
        <svg class="icone" viewBox="0 0 24 24"
             fill="none" stroke="currentColor"
             stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <path d="m5.6 5.6 12.8 12.8"/>
        </svg>
      </button>
    </div>

    <p class="rodape">Uma pergunta, um sentimento, uma história.</p>
  </main>

  <main id="resultado" aria-live="polite">
    <h2>Boa decisão, somos namorados agora IT</h2>

    <p>
      Que este seja o início de uma história bonita,
      cheia de carinho, cumplicidade e momentos felizes.
    </p>

    <a
      class="whatsapp-link"
      href="https://wa.me/258870880696?text=Oi%20amor"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Enviar mensagem pelo WhatsApp"
    >
      <svg class="whatsapp-icone" viewBox="0 0 24 24"
           fill="currentColor" aria-hidden="true">
        <path d="M20.52 3.48A11.87 11.87 0 0 0 12.07 0C5.48 0 .12 5.36.12 11.95c0 2.1.55 4.15 1.6 5.96L0 24l6.24-1.64a11.9 11.9 0 0 0 5.82 1.48h.01c6.58 0 11.94-5.36 11.94-11.95 0-3.19-1.24-6.19-3.49-8.41ZM12.07 21.8h-.01a9.9 9.9 0 0 1-5.04-1.38l-.36-.21-3.7.97.99-3.6-.24-.37a9.85 9.85 0 0 1-1.52-5.26c0-5.45 4.44-9.89 9.9-9.89a9.82 9.82 0 0 1 7 2.9 9.82 9.82 0 0 1 2.9 7c0 5.46-4.44 9.9-9.92 9.9Zm5.43-7.41c-.3-.15-1.77-.87-2.05-.97-.28-.1-.48-.15-.68.15-.2.3-.78.97-.96 1.17-.18.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.8-1.49-1.78-1.67-2.08-.18-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.18.2-.3.3-.5.1-.2.05-.38-.03-.53-.08-.15-.68-1.64-.93-2.24-.25-.59-.5-.51-.68-.52h-.58c-.2 0-.53.08-.81.38-.28.3-1.06 1.04-1.06 2.53 0 1.49 1.09 2.93 1.24 3.13.15.2 2.14 3.27 5.18 4.58.72.31 1.28.49 1.71.63.72.23 1.38.2 1.9.12.58-.09 1.77-.72 2.02-1.42.25-.7.25-1.29.18-1.42-.08-.13-.28-.2-.58-.35Z"/>
      </svg>
      Vamos conversar no WhatsApp
    </a>

    <svg class="coracao-final" viewBox="0 0 24 24"
         fill="currentColor" aria-label="Coração">
      <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/>
    </svg>
  </main>

  <script>
    const botaoNao = document.getElementById("nao");
    const botaoSim = document.getElementById("sim");

    function fugir(event) {
      if (event) event.preventDefault();

      const posicaoAtual = botaoNao.getBoundingClientRect();
      const largura = botaoNao.offsetWidth;
      const altura = botaoNao.offsetHeight;
      const maxX = Math.max(0, window.innerWidth - largura);
      const maxY = Math.max(0, window.innerHeight - altura);
      const margemX = Math.min(8, maxX / 2);
      const margemY = Math.min(8, maxY / 2);
      const maxPasso = 4 * 96 / 2.54;
      const toque = event && event.touches && event.touches[0];
      const ratoX = event && Number.isFinite(event.clientX)
        ? event.clientX
        : toque ? toque.clientX : posicaoAtual.left + largura / 2;
      const ratoY = event && Number.isFinite(event.clientY)
        ? event.clientY
        : toque ? toque.clientY : posicaoAtual.top + altura / 2;
      const xAtual = Math.max(margemX, Math.min(posicaoAtual.left, maxX - margemX));
      const yAtual = Math.max(margemY, Math.min(posicaoAtual.top, maxY - margemY));
      let destino = { x: xAtual, y: yAtual };
      let maiorDistancia = -1;

      for (let i = 0; i < 60; i++) {
        const angulo = Math.random() * Math.PI * 2;
        const distancia = maxPasso * (0.55 + Math.random() * 0.45);
        const x = Math.max(margemX, Math.min(
          xAtual + Math.cos(angulo) * distancia,
          maxX - margemX
        ));
        const y = Math.max(margemY, Math.min(
          yAtual + Math.sin(angulo) * distancia,
          maxY - margemY
        ));
        const distanciaDoCursor = Math.hypot(
          x + largura / 2 - ratoX,
          y + altura / 2 - ratoY
        );

        if (distanciaDoCursor > maiorDistancia) {
          maiorDistancia = distanciaDoCursor;
          destino = { x, y };
        }
      }

      botaoNao.classList.add("fugir");
      botaoNao.style.left = posicaoAtual.left + "px";
      botaoNao.style.top = posicaoAtual.top + "px";
      botaoNao.style.left = destino.x + "px";
      botaoNao.style.top = destino.y + "px";
    }

    // O botão foge quando o cursor se aproxima.
    botaoNao.addEventListener("pointerenter", fugir);

    // Também foge quando tentam clicar.
    botaoNao.addEventListener("click", fugir);

    // Nos telemóveis, foge quando tentam tocar.
    botaoNao.addEventListener("touchstart", fugir, {
      passive: false
    });

    // Mantém o botão dentro do ecrã quando este muda de tamanho.
    window.addEventListener("resize", () => {
      if (!botaoNao.classList.contains("fugir")) return;

      const maxX = Math.max(0, window.innerWidth - botaoNao.offsetWidth);
      const maxY = Math.max(0, window.innerHeight - botaoNao.offsetHeight);
      const margemX = Math.min(16, maxX / 2);
      const margemY = Math.min(16, maxY / 2);
      const posicaoX = Number.parseFloat(botaoNao.style.left);
      const posicaoY = Number.parseFloat(botaoNao.style.top);
      const x = Math.max(margemX, Math.min(
        Number.isFinite(posicaoX) ? posicaoX : margemX,
        maxX - margemX
      ));
      const y = Math.max(margemY, Math.min(
        Number.isFinite(posicaoY) ? posicaoY : margemY,
        maxY - margemY
      ));

      botaoNao.style.left = x + "px";
      botaoNao.style.top = y + "px";
    });

    // Resposta ao clicar em SIM.
    botaoSim.addEventListener("click", () => {
      document.getElementById("pedido").style.display = "none";
      document.getElementById("resultado").style.display = "block";
      botaoNao.style.display = "none";

      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>

</body>
</html>
